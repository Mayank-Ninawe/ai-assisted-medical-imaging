name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_ORTHANC_INTEGRATION: "0"
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.7,<3" "torchvision>=0.22,<1" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,backend,ml]"

      - name: Run lint checks
        run: python -m ruff check .

      - name: Run tests and report optional skips
        run: python -m pytest -q -ra

  frontend-checks:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run TypeScript checks and production build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate